plugins { id 'com.android.application' }

android {
    namespace 'ir.tehran.offlinenavigator'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.tehran.offlinenavigator.v5'
        minSdk 23
        targetSdk 28
        versionCode 5
        versionName '1.4'
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Include the legacy v1 signature as well as modern schemes for installer compatibility.
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
