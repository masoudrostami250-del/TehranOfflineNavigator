name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
concurrency:
  group: tehran-offline-navigator-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Clean build
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK and signing
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee app-badging.txt
          grep -q "package: name='ir.tehran.offlinenavigator.v5' versionCode='5'" app-badging.txt
          cp "$APK" TehranOfflineNavigator-v5.apk
          sha256sum TehranOfflineNavigator-v5.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TehranOfflineNavigator-v5
          path: TehranOfflineNavigator-v5.apk
          if-no-files-found: error
      - name: Publish exact verified APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: install-test-v5
          name: Tehran Offline Navigator v5 (clean install test)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: TehranOfflineNavigator-v5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
